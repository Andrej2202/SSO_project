<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Генератор дипломов</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    margin: 0; padding: 24px;
    background: #f4f6fa; color: #222;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { margin-top: 0; }
  .card {
    background: #fff; border-radius: 12px; padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 20px;
  }
  label { display:block; margin: 10px 0 4px; font-weight: 500; }
  input, select {
    width: 100%; padding: 10px; border: 1px solid #ccd;
    border-radius: 8px; font-size: 14px;
  }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  button {
    margin-top: 16px; padding: 12px 20px;
    background: #2d6cdf; color: #fff; border: 0;
    border-radius: 8px; font-size: 15px; cursor: pointer;
  }
  button:hover { background: #2458b8; }
  button:disabled { background: #999; cursor: not-allowed; }
  #preview {
    margin-top: 16px; text-align: center;
    min-height: 100px;
  }
  #preview img { max-width: 100%; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
  .error { color: #c0392b; margin-top: 8px; }
  .hint { color: #777; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Генератор дипломов</h1>

  <div class="card">
    <label>Шаблон</label>
    <select id="template"></select>

    <label>ФИО участника *</label>
    <input id="name" placeholder="Иванов Иван Иванович">

    <div class="row">
      <div>
        <label>Соревнование *</label>
        <input id="comp" placeholder="Кубок города по плаванию">
      </div>
      <div>
        <label>Группа</label>
        <input id="group" placeholder="Юниоры 14-16 лет">
      </div>
      <div>
        <label>Место</label>
        <input id="place" placeholder="1">
      </div>
    </div>

    <button id="go">Сгенерировать диплом</button>
    <div id="status" class="error"></div>
    <p class="hint">* — обязательные поля</p>
  </div>

  <div class="card">
    <div id="preview">Здесь появится готовый диплом</div>
  </div>
</div>

<script>
const API = ''; // тот же хост, что и UI

async function loadTemplates() {
  const sel = document.getElementById('template');
  try {
    const r = await fetch(API + '/api/templates');
    const list = await r.json();
    sel.innerHTML = '';
    if (!list.length) {
      sel.innerHTML = '<option value="">— шаблонов нет —</option>';
      return;
    }
    list.forEach(t => {
      const o = document.createElement('option');
      o.value = t; o.textContent = t;
      sel.appendChild(o);
    });
  } catch (e) {
    sel.innerHTML = '<option value="">ошибка загрузки</option>';
  }
}

document.getElementById('go').addEventListener('click', async () => {
  const name  = document.getElementById('name').value.trim();
  const comp  = document.getElementById('comp').value.trim();
  const group = document.getElementById('group').value.trim();
  const place = document.getElementById('place').value.trim();
  const tmpl  = document.getElementById('template').value;
  const status = document.getElementById('status');
  const preview = document.getElementById('preview');
  status.textContent = '';

  if (!name || !comp || !tmpl) {
    status.textContent = 'Заполните ФИО, соревнование и выберите шаблон';
    return;
  }

  // Собираем единый текст для бэкенда
  let text = comp;
  if (group) text += ' • ' + group;
  if (place) text += ' • ' + place + ' место';

  const url = API + '/generate?' + new URLSearchParams({
    name, text, template: tmpl
  });

  preview.innerHTML = 'Генерируем...';
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(await r.text());
    const blob = await r.blob();
    const objUrl = URL.createObjectURL(blob);
    preview.innerHTML =
      `<img src="${objUrl}"><br>
       <a href="${objUrl}" download="diploma_${name}.png">
         <button type="button">Скачать PNG</button>
       </a>`;
  } catch (e) {
    preview.innerHTML = '';
    status.textContent = 'Ошибка: ' + e.message;
  }
});

loadTemplates();
</script>
</body>
</html>
